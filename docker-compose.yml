name: technician

services:
  technician:
    build: .
    init: true
    ports:
      - "9590:9590"
    volumes:
      - ./config/technician.yml:/etc/technician/technician.yml:ro
      - ./config/checks.yml:/etc/technician/checks.yml:ro
      - ./config/playwright:/etc/technician/playwright:ro
      - ./config/budgets.yml:/etc/technician/budgets.yml:ro
      - technician_data:/var/lib/technician
    environment:
      - ORIGIN_ID=local
      - GOMAXPROCS=2
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9590/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.13.0@sha256:c6b27ea434f8389bfe233fbc7be381cf50587c286e871bc842008f5a1b1908a7
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--storage.tsdb.retention.size=5GB"
      - "--storage.tsdb.wal-compression"
      - "--web.external-url=${PROMETHEUS_EXTERNAL_URL:-http://localhost:9090}"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  alertmanager:
    image: prom/alertmanager:v0.33.0@sha256:af26fbe4dd1886ac0efd7bd55cd9027da262e105b137a376522b7c14c3626e4a
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ./prometheus/templates:/etc/alertmanager/templates:ro
      - alertmanager_data:/alertmanager
    env_file:
      - path: .env
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        awk '{
          while (match($$0, /\$$\{[A-Za-z_][A-Za-z_0-9]*\}/)) {
            var = substr($$0, RSTART+2, RLENGTH-3)
            val = (var in ENVIRON) ? ENVIRON[var] : ""
            $$0 = substr($$0, 1, RSTART-1) val substr($$0, RSTART+RLENGTH)
          }
          print
        }' /etc/alertmanager/alertmanager.yml.tmpl > /etc/alertmanager/alertmanager.yml
        exec /bin/alertmanager \
          --config.file=/etc/alertmanager/alertmanager.yml \
          --web.external-url="${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ./prometheus/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./prometheus/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./prometheus/grafana-alerting.yml:/etc/grafana/provisioning/alerting/alerting.yml:ro
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 768M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  technician_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
