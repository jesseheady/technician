services:
  technician:
    build: .
    init: true
    ports:
      - "9590:9590"
    volumes:
      - ./config/technician.yml:/etc/technician/technician.yml:ro
      - ./config/checks:/etc/technician/checks:ro
      - ./config/budgets.yml:/etc/technician/budgets.yml:ro
      - technician_data:/var/lib/technician
    environment:
      - SITE_CODE=local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9590/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.11.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--storage.tsdb.retention.size=5GB"
      - "--storage.tsdb.wal-compression"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  alertmanager:
    image: prom/alertmanager:v0.32.0
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ./prometheus/templates:/etc/alertmanager/templates:ro
    env_file:
      - path: .env
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed \
          -e 's|__DISCORD_WEBHOOK_CHATOPS__|'"$$DISCORD_WEBHOOK_CHATOPS"'|g' \
          -e 's|__DISCORD_WEBHOOK_INCIDENTS__|'"$$DISCORD_WEBHOOK_INCIDENTS"'|g' \
          -e 's|__DISCORD_WEBHOOK_INFRA__|'"$$DISCORD_WEBHOOK_INFRA"'|g' \
          -e 's|__DISCORD_WEBHOOK_EXPIRY__|'"$$DISCORD_WEBHOOK_EXPIRY"'|g' \
          -e 's|__DISCORD_WEBHOOK_PERF__|'"$$DISCORD_WEBHOOK_PERF"'|g' \
          -e 's|__PUSHOVER_USER_KEY__|'"$$PUSHOVER_USER_KEY"'|g' \
          -e 's|__PUSHOVER_API_TOKEN__|'"$$PUSHOVER_API_TOKEN"'|g' \
          /etc/alertmanager/alertmanager.yml.tmpl > /etc/alertmanager/alertmanager.yml
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:12.4.2
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ./prometheus/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./prometheus/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./prometheus/grafana-alerting.yml:/etc/grafana/provisioning/alerting/alerting.yml:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  technician_data:
  prometheus_data:
  grafana_data:
