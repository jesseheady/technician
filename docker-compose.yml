name: technician

services:
  technician:
    # Builds from local source by default so a fresh checkout works with no
    # external image. Operators can pull the published image instead by adding
    # the docker-compose.prod.yml overlay (see that file).
    build: .
    init: true
    ports:
      - "9590:9590"
    volumes:
      - ./config/technician.yml:/etc/technician/technician.yml:ro
      - ./config/checks.yml:/etc/technician/checks.yml:ro
      - ./config/playwright:/etc/technician/playwright:ro
      - ./config/budgets.yml:/etc/technician/budgets.yml:ro
      - technician_data:/var/lib/technician
    environment:
      - ORIGIN_ID=local
      - GOMAXPROCS=2
    deploy:
      resources:
        # Browsers run in the playwright service. Raise to 1G/512M if you switch
        # playwright.mode to local.
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9590/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--storage.tsdb.retention.size=5GB"
      - "--storage.tsdb.wal-compression"
      - "--web.external-url=${PROMETHEUS_EXTERNAL_URL:-http://localhost:9090}"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  alertmanager:
    image: prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ./prometheus/templates:/etc/alertmanager/templates:ro
      - alertmanager_data:/alertmanager
    env_file:
      - path: .env
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        awk '{
          while (match($$0, /\$$\{[A-Za-z_][A-Za-z_0-9]*\}/)) {
            var = substr($$0, RSTART+2, RLENGTH-3)
            val = (var in ENVIRON) ? ENVIRON[var] : ""
            $$0 = substr($$0, 1, RSTART-1) val substr($$0, RSTART+RLENGTH)
          }
          print
        }' /etc/alertmanager/alertmanager.yml.tmpl > /etc/alertmanager/alertmanager.yml
        exec /bin/alertmanager \
          --config.file=/etc/alertmanager/alertmanager.yml \
          --web.external-url="${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:13.1.1@sha256:7cb8c64c4d57a57e734073f3cc94620adb24a0acb929bd80ba9f14017e3a975b
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ./prometheus/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./prometheus/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./prometheus/grafana-alerting.yml:/etc/grafana/provisioning/alerting/alerting.yml:ro
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 768M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy

  # Browser runtime for Playwright checks. Stock upstream image, driven by a
  # command like the services above. Tag must match the client version in
  # internal/playwright/scripts/package.json; a mismatch is rejected with 428.
  playwright:
    image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    command: npx -y playwright@1.62.1 run-server --port 3000 --host 0.0.0.0
    init: true
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          # ~300 MB idle; roughly 300 MB more per concurrent Chromium.
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped

volumes:
  technician_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
