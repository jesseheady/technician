services:
  technician:
    build: .
    ports:
      - "9394:9394"
    volumes:
      - ./config/technician.yml:/etc/technician/technician.yml:ro
      - ./config/probes:/etc/technician/probes:ro
      - ./config/budgets.yml:/etc/technician/budgets.yml:ro
      - technician_data:/var/lib/technician
    environment:
      - SITE_CODE=local
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  # alertmanager-discord bridge (optional - only needed if using Alertmanager
  # with Discord; native webhooks in technician.yml are simpler).
  # See: https://github.com/benjojo/alertmanager-discord
  # alertmanager-discord:
  #   image: benjojo/alertmanager-discord:latest
  #   environment:
  #     - DISCORD_WEBHOOK=https://discord.com/api/webhooks/YOUR/WEBHOOK

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ./prometheus/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./prometheus/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  technician_data:
  prometheus_data:
  grafana_data:
