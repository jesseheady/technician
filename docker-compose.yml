name: technician

services:
  technician:
    # Builds from local source by default so a fresh checkout works with no
    # external image. Operators can pull the published image instead by adding
    # the docker-compose.prod.yml overlay (see that file).
    build: .
    init: true
    ports:
      - "9590:9590"
    volumes:
      # Mount the directory. A single-file mount can show an old version after an edit.
      - ./config:/etc/technician:ro
      - technician_data:/var/lib/technician
    environment:
      - ORIGIN_ID=local
      - GOMAXPROCS=2
      # The stack ships a playwright service, so use it. The example config
      # defaults to local, which is what a bare binary needs.
      - PLAYWRIGHT_MODE=managed
      - PLAYWRIGHT_SERVER_URL=ws://playwright:3000/
    deploy:
      resources:
        # Browsers run in the playwright service, but each concurrent check still
        # holds a Node client here (~55 MB measured). The limit has to cover
        # max_browsers of those, not just the ~20 MB Go process. Raise to 1G/512M
        # if you switch playwright.mode to local.
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9590/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--storage.tsdb.retention.size=5GB"
      - "--storage.tsdb.wal-compression"
      - "--web.external-url=${PROMETHEUS_EXTERNAL_URL:-http://localhost:9090}"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  alertmanager:
    image: prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus:/etc/alertmanager/src:ro
      - ./prometheus/templates:/etc/alertmanager/templates:ro
      - alertmanager_data:/alertmanager
    env_file:
      - path: .env
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        awk '{
          while (match($$0, /\$$\{[A-Za-z_][A-Za-z_0-9]*\}/)) {
            var = substr($$0, RSTART+2, RLENGTH-3)
            val = (var in ENVIRON) ? ENVIRON[var] : ""
            $$0 = substr($$0, 1, RSTART-1) val substr($$0, RSTART+RLENGTH)
          }
          print
        }' /etc/alertmanager/src/alertmanager.yml > /tmp/alertmanager.yml
        exec /bin/alertmanager \
          --config.file=/tmp/alertmanager.yml \
          --web.external-url="${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ./prometheus/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./prometheus/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./prometheus/grafana-alerting.yml:/etc/grafana/provisioning/alerting/alerting.yml:ro
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 768M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy

  # Browser runtime for Playwright checks. Stock upstream image, driven by a
  # command like the services above. Tag must match the client version in
  # internal/playwright/scripts/package.json; a mismatch is rejected with 428.
  playwright:
    image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    command: npx -y playwright@1.62.1 run-server --port 3000 --host 0.0.0.0
    init: true
    expose:
      - "3000"
    volumes:
      # Unlike the other services, this image ships the browsers but not the
      # playwright package, so npx fetches it at start. Caching makes restarts
      # work offline; without it every restart needs registry.npmjs.org.
      - playwright_npm:/root/.npm
    deploy:
      resources:
        limits:
          # ~257 MB idle; ~564 MB measured with four concurrent trivial pages.
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped

volumes:
  technician_data:
  playwright_npm:
  prometheus_data:
  alertmanager_data:
  grafana_data:
