# Trivy vulnerability ignores.
#
# Only for FIXABLE CVEs that we cannot resolve yet because the fix has not
# reached our base image. Unfixable upstream CVEs are handled by
# `ignore-unfixed: true` in the trivy workflow, not here.
#
# Every entry MUST have `expired_at` and a `statement`. When the date passes,
# the suppression lapses and the CVE fails CI again (a re-triage tripwire).
# The `trivy-ignore-audit` workflow watches these dates: when an entry is due
# it re-scans and either opens a PR to remove it (fix landed) or an issue to
# re-triage (still vulnerable). See docs below.
#
# Currently empty: the runtime image strips npm, corepack, and yarn after the
# build uses them (see Dockerfile), which removed every fixable CVE the image
# scan was reporting — those all came from npm's bundled dependency tree, not
# from anything we ship or can patch.
vulnerabilities: []
