# Example check definitions for Technician.
# Copy to config/checks.yml and customise for your targets.
# All check types can coexist in a single file.
# Alternatively, split into multiple files under config/checks/ — Technician
# merges all .yml files in the directory automatically.

# Example HTTP checks.
# Copy to config/checks/http.yml and customise for your targets.
# degraded_after guidance:
#   Static / CDN:  500ms (cloud) / 3s (residential)
#   API / dynamic:   1s (cloud) / 5s (residential)
# HTTP latency varies widely by what's behind the URL. A static site on a CDN
# responds in 50-100ms from cloud; a dynamic API may take 500ms-2s legitimately.
# Residential adds ISP latency + Docker overhead.

# `group` and `tags` are optional metadata used by check_filter (see
# technician.yml) so one checks/ directory can serve many deployment targets.
# A check matches a tag filter if it carries any of the requested tags.
- name: example.com
  type: http
  group: Marketing
  tags: [public, critical]
  url: https://example.com
  expected_status: 200
  schedule: "*/60 * * * * *"
  degraded_after: 3s
  retry:
    count: 2
    backoff: exponential
    delay: 1s

- name: example.com/api
  type: http
  group: API
  tags: [critical]
  url: https://jsonplaceholder.typicode.com/posts/1
  expected_status: 200
  timeout: 5s
  schedule: "0 */5 * * * *"
  degraded_after: 2s
  retry:
    count: 1
    backoff: none
    delay: 2s

# Custom method/headers example:
# - name: example.com/graphql
#   url: https://example.com/graphql
#   method: POST
#   headers:
#     Content-Type: application/json
#     Authorization: "Bearer ${API_TOKEN}"
#   body: '{"query":"{ __typename }"}'
#   expected_status: 200
#   schedule: "*/60 * * * * *"
