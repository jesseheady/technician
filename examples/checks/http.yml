# Example HTTP checks.
# Copy to config/probes/http.yml and customise for your targets.
#
# degraded_after guidance:
#   Static / CDN:  500ms (cloud) / 3s (residential)
#   API / dynamic:   1s (cloud) / 5s (residential)
# HTTP latency varies widely by what's behind the URL. A static site on a CDN
# responds in 50-100ms from cloud; a dynamic API may take 500ms-2s legitimately.
# Residential adds ISP latency + Docker overhead.

- name: example.com
  group: Marketing
  url: https://example.com
  expected_status: 200
  schedule: "*/60 * * * * *"
  degraded_after: 3s
  retry:
    count: 2
    backoff: exponential
    delay: 1s

- name: example.com/api
  group: API
  url: https://jsonplaceholder.typicode.com/posts/1
  expected_status: 200
  timeout: 5s
  schedule: "0 */5 * * * *"
  degraded_after: 2s
  retry:
    count: 1
    backoff: none
    delay: 2s

