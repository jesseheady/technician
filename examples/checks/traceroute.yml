# Example traceroute checks.
# Requires mtr (brew install mtr on macOS). May need root for raw sockets.
#
# degraded_after guidance:
#   Cloud VPS:             10s
#   Residential / Docker:  15s
# Traceroute spawns an mtr subprocess that sends multiple check packets across
# many hops. 5-10s is normal even from fast networks. Only flag as degraded if
# the trace is taking significantly longer than usual.

- name: "example.com (traceroute)"
  group: Infrastructure
  host: example.com
  max_hops: 30
  count: 3
  schedule: "0 */30 * * * *"
  timeout: 30s
  degraded_after: 15s
  retry:
    count: 1
    backoff: none
    delay: 5s

