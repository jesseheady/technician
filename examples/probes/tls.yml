# Example TLS certificate probes.
# Connects to host:port, inspects the certificate chain, and reports
# subject, issuer, expiry, days remaining, and chain validity.

- name: Google TLS
  group: Infrastructure
  host: google.com:443
  warn_days: 30
  critical_days: 7
  timeout: 10s
  schedule: "0 0 */6 * * *"

