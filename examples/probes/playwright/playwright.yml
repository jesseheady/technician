# Example Playwright (browser) probes.
# Requires Node.js 18+ and Playwright Chromium browser.
#
# degraded_after guidance:
#   Cloud VPS:              5-8s
#   Residential / Docker:  10-15s
# Playwright launches a full Chromium browser, loads the page, and collects Web
# Vitals. Baseline is 3-5s for a simple page; complex flows with interactions,
# throttled networks, and video recording take longer. Mobile 3G profiles add
# significant latency by design — set thresholds accordingly.

- name: "example.com (desktop)"
  group: Marketing
  script: playwright/example_flow.js
  base_url: "https://example.com"
  schedule: "0 */5 * * * *"
  timeout: 120s
  degraded_after: 10s
  retry:
    count: 1
    backoff: none
    delay: 5s

- name: "example.com (mobile 4g)"
  group: Marketing
  script: playwright/example_flow.js
  base_url: "https://example.com"
  network: "4g"
  device: "iPhone 14"
  schedule: "0 */5 * * * *"
  timeout: 120s
  degraded_after: 15s
  retry:
    count: 1
    backoff: none
    delay: 5s

- name: "example.com (mobile 3g)"
  group: Marketing
  script: playwright/example_flow.js
  base_url: "https://example.com"
  network: "3g"
  device: "iPhone 14"
  schedule: "0 */10 * * * *"
  timeout: 180s
  degraded_after: 20s
  retry:
    count: 1
    backoff: none
    delay: 5s
