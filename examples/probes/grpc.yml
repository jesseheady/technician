# Example gRPC health check probes.
# Uses the standard grpc.health.v1.Health/Check protocol.

- name: API Health
  group: API
  host: api.example.com:443
  service: myapp
  tls: true
  timeout: 5s
  schedule: "*/60 * * * * *"
  retry:
    count: 1
    backoff: none
    delay: 2s

