# Example NTP probes.
# Queries an NTP server over UDP and reports clock offset, stratum, and RTT.

- name: Pool NTP
  group: Infrastructure
  server: pool.ntp.org
  timeout: 5s
  schedule: "0 */10 * * * *"
  retry:
    count: 1
    backoff: none
    delay: 2s

