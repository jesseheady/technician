# Example SMTP probes.
# Tests that the SMTP server accepts connections on the given port.

- name: Gmail SMTP
  group: Infrastructure
  host: smtp.gmail.com
  port: 587
  schedule: "0 */15 * * * *"
  retry:
    count: 1
    backoff: none
    delay: 3s

