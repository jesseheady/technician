# Example HTTP probes.
# Copy to config/probes/http.yml and customise for your targets.

- name: example.com
  group: Marketing
  url: https://example.com
  expected_status: 200
  schedule: "*/60 * * * * *"

- name: example.com/api
  group: API
  url: https://jsonplaceholder.typicode.com/posts/1
  expected_status: 200
  timeout: 5s
  schedule: "*/60 * * * * *"

