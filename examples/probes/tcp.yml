# Example TCP probes.
# Tests that the target accepts TCP connections on the given port.
#
# degraded_after guidance:
#   Cloud VPS (same region):   500ms (plain) / 1s (TLS)
#   Cloud VPS (cross-region):    1s (plain) / 2s (TLS)
#   Residential / Docker:        2s (plain) / 3s (TLS)
# TCP includes connection setup; TLS adds a handshake on top. Thresholds should
# be higher than raw ICMP/DNS for the same target.

- name: Redis
  group: Infrastructure
  host: redis.example.com
  port: 6379
  timeout: 5s
  schedule: "*/60 * * * * *"
  degraded_after: 2s
  retry:
    count: 1
    backoff: none
    delay: 2s

