service: technician
hostname: monitor.example.com

origins:
  - id: local
    city: Local
    country: US

    platform: docker
  - id: us-east-1
    city: N. Virginia
    country: US

    platform: aws
  - id: us-west-2
    city: Oregon
    country: US

    platform: aws

metrics:
  prometheus:
    listen: ":9590"
  otel:
    endpoint: ""

artifacts:
  # The local driver is for dev/inspection. /tmp is ephemeral (not on the
  # technician_data volume in Docker), so artifacts here do not survive a
  # container restart. Use driver: s3 for retention in production.
  driver: local
  path: /tmp/technician/artifacts
  retention: 72h

playwright:
  mode: local
  # max_browsers: 2  # max concurrent Chromium instances (default 2, increase for CI or dedicated runners)

# Check filter (optional). Run only a subset of the checks/ directory, so one
# check config can serve many deployment targets from a single per-target
# technician.yml. Each dimension is a set of allowed values: a check must match
# every dimension listed (AND), and any value within a dimension (OR). Omit a
# dimension for no restriction; omit the whole block to run everything.
# Matching is case-insensitive. CLI equivalents override per dimension:
#   technician worker --types http,dns   --groups Infrastructure   --tags browser
#
# check_filter:
#   types: [http, dns]        # valid: http, tcp, udp, dns, icmp, grpc, ntp,
#                             #        tls, smtp, traceroute, bgp,
#                             #        domain_expiry, playwright
#   groups: [Infrastructure]  # matches the `group:` field on checks
#   tags: [critical]          # matches any of the `tags:` on a check

# Native webhook notifications (optional).
# Technician sends notifications directly — no Alertmanager or Grafana needed.
# For richer alerting (silencing, grouping, escalation, alert history),
# use Grafana alerting instead (see docs/alerting.md).
#
# Events:    check_down, check_up, budget_violation, cert_expiring
# Severities: warning, critical (omit to receive all)
#
# webhooks:
#   # Slack channel for all warnings + critical (informational)
#   - url: https://hooks.slack.com/services/T.../B.../xxx
#     type: slack
#     events: [check_down, check_up, cert_expiring, budget_violation]
#     cooldown: 5m
#
#   # Discord for warnings only (cert expiry heads-up, budget alerts)
#   - url: https://discord.com/api/webhooks/ID/TOKEN
#     type: discord
#     events: [cert_expiring, budget_violation]
#     severities: [warning]
#     cooldown: 5m
#
#   # PagerDuty / opsgenie for critical only (pages on-call)
#   - url: https://your-endpoint.example.com/alerts
#     type: generic
#     events: [check_down, cert_expiring]
#     severities: [critical]
#     cooldown: 10m
