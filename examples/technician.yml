service: technician
hostname: monitor.example.com

sites:
  - code: local
    city: Local
    country: US
    geohash: local
    provider: docker
  - code: us-east-1
    city: N. Virginia
    country: US
    geohash: dqcjq
    provider: aws
  - code: us-west-2
    city: Oregon
    country: US
    geohash: c20y
    provider: aws

metrics:
  prometheus:
    listen: ":9394"
  otel:
    endpoint: ""

artifacts:
  driver: local
  path: /tmp/technician/artifacts
  retention: 72h

playwright:
  mode: local
  # max_browsers: 2  # max concurrent Chromium instances (default 2, increase for CI or dedicated runners)

# Native webhook notifications (optional).
# Technician sends notifications directly — no Alertmanager or Grafana needed.
# For richer alerting (silencing, grouping, escalation, alert history),
# use Grafana alerting instead (see docs/alerting.md).
#
# webhooks:
#   - url: https://discord.com/api/webhooks/ID/TOKEN
#     type: discord
#     events: [probe_down, probe_up, budget_violation]
#     cooldown: 5m
#
#   - url: https://hooks.slack.com/services/T.../B.../xxx
#     type: slack
#     events: [probe_down, probe_up]
#     cooldown: 5m
#
#   - url: https://your-endpoint.example.com/alerts
#     type: generic    # posts Event JSON to any HTTP endpoint
#     events: [probe_down, budget_violation]
#     cooldown: 10m
