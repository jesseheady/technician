# Local development config: run Technician probing localhost mock endpoints.
# Start a mock HTTP server on 8080 first, e.g.:
#   python3 -c "from http.server import HTTPServer, BaseHTTPRequestHandler; ..."
# Copy to config/local/ then run:
#   technician worker --config config/local/technician.yml

service: technician
hostname: localhost

origins:
  - id: local
    city: Local
    country: XX

    platform: mock

metrics:
  prometheus:
    listen: ":9590"
  otel:
    endpoint: ""

artifacts:
  # Local driver = dev/inspection only. /tmp is ephemeral and not on the
  # technician_data volume, so artifacts here don't survive a restart. Use
  # driver: s3 for retention in production.
  driver: local
  path: /tmp/technician/artifacts
  retention: 24h

playwright:
  mode: local
