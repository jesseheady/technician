# Example performance budgets.
# Check names must match entries in your checks/ directory.
# Copy to config/budgets.yml and customise thresholds for your targets.

# Fallback, applied only to checks with no entry of their own. A named entry
# below replaces this one outright — its thresholds are not combined with these,
# so a check that is legitimately slow only needs its own `duration` here.
#
# Thresholds for metrics a check never emits (lcp/inp/cls on an HTTP check, say)
# are ignored, not failed.
- check: "*"
  thresholds:
    duration: 10000   # 10s total request time
  alert_on: exceed

# HTTP check budgets
- check: example.com
  thresholds:
    duration: 3000
    ttfb: 800
    dns: 250
    tls: 150
  alert_on: exceed

# Browser (Playwright) check budgets
- check: "example.com (desktop)"
  thresholds:
    duration: 30000
    lcp: 2500         # Largest Contentful Paint
    inp: 200          # Interaction to Next Paint
    cls: 0.1          # Cumulative Layout Shift
    dom_complete: 5000
  alert_on: exceed

- check: "example.com (mobile 4g)"
  thresholds:
    duration: 30000
    lcp: 4000
    inp: 300
    cls: 0.15
    dom_complete: 8000
  alert_on: exceed

- check: "example.com (mobile 3g)"
  thresholds:
    duration: 45000
    lcp: 6000
    inp: 500
    cls: 0.2
    dom_complete: 15000
  alert_on: exceed
