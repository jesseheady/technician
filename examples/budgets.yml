# ── Global defaults ───────────────────────────────────────────────
- probe: "*"
  thresholds:
    duration: 10000
  alert_on: exceed

# ── jesseheady.com (static S3 + CloudFront) ──────────────────────
- probe: jesseheady.com
  thresholds:
    duration: 3000
    ttfb: 800
    dns: 100
    tls: 150
    lcp: 1500
    inp: 100
    cls: 0.05
  alert_on: exceed

- probe: jesseheady.com/feed
  thresholds:
    duration: 5000
    ttfb: 1000
  alert_on: exceed

- probe: jesseheady.com/robots
  thresholds:
    duration: 2000
    ttfb: 500
  alert_on: exceed
