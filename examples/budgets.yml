# ── Global defaults ───────────────────────────────────────────────
- probe: "*"
  thresholds:
    duration: 10000
  alert_on: exceed

# ── jesseheady.com (static S3 + CloudFront) ──────────────────────
- probe: jesseheady.com
  thresholds:
    duration: 3000
    ttfb: 800
    dns: 250
    tls: 150
    lcp: 1500
    inp: 100
    cls: 0.05
  alert_on: exceed

# ── jesseheady.com desktop (Playwright) ──────────────────────────
- probe: "jesseheady.com (desktop)"
  thresholds:
    duration: 30000
    lcp: 2500
    inp: 200
    cls: 0.1
    dom_complete: 5000
  alert_on: exceed

# ── jesseheady.com mobile 4G (Playwright) ────────────────────────
- probe: "jesseheady.com (mobile 4g)"
  thresholds:
    duration: 30000
    lcp: 4000
    inp: 300
    cls: 0.15
    dom_complete: 8000
  alert_on: exceed

# ── jesseheady.com mobile 3G (Playwright) ────────────────────────
- probe: "jesseheady.com (mobile 3g)"
  thresholds:
    duration: 45000
    lcp: 6000
    inp: 500
    cls: 0.2
    dom_complete: 15000
  alert_on: exceed

- probe: jesseheady.com/feed
  thresholds:
    duration: 5000
    ttfb: 1000
  alert_on: exceed

- probe: jesseheady.com/robots
  thresholds:
    duration: 2000
    ttfb: 500
  alert_on: exceed
