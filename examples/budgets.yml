# Example performance budgets.
# Probe names must match entries in your probes/ directory.
# Copy to config/budgets.yml and customise thresholds for your targets.

# Global defaults (applied to any probe not listed below)
- probe: "*"
  thresholds:
    duration: 10000   # 10s total request time
  alert_on: exceed

# HTTP probe budgets
- probe: example.com
  thresholds:
    duration: 3000
    ttfb: 800
    dns: 250
    tls: 150
  alert_on: exceed

# Browser (Playwright) probe budgets
- probe: "example.com (desktop)"
  thresholds:
    duration: 30000
    lcp: 2500         # Largest Contentful Paint
    inp: 200          # Interaction to Next Paint
    cls: 0.1          # Cumulative Layout Shift
    dom_complete: 5000
  alert_on: exceed

- probe: "example.com (mobile 4g)"
  thresholds:
    duration: 30000
    lcp: 4000
    inp: 300
    cls: 0.15
    dom_complete: 8000
  alert_on: exceed
