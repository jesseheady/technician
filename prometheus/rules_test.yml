# promtool rule unit tests.
#
# Run: promtool test rules rules_test.yml
# (also executed in CI / pre-commit alongside `promtool check rules`).

rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  # Staleness grace period (#111): a data gap must fire TechnicianDataGap and,
  # crucially, keep it firing through the ~10-min post-resume stabilization
  # window — not clear the instant results resume.
  - name: TechnicianDataGap fires on a gap and holds through recovery
    interval: 1m
    input_series:
      # last-run timestamp tracks wall-clock while fresh (seconds_since ≈ 0),
      # freezes at 540 during a ~10-min gap (min 10–20), then tracks again on
      # recovery (min 21–30).
      - series: 'technician_last_run_timestamp_seconds'
        values: '0+60x9 540+0x10 1260+60x9'
    alert_rule_test:
      # Steady state: fresh data, no gap.
      - eval_time: 5m
        alertname: TechnicianDataGap
        exp_alerts: []
      # 4 min into the frozen window seconds_since is exactly 300 — not yet over.
      - eval_time: 14m
        alertname: TechnicianDataGap
        exp_alerts: []
      # Gap now exceeds 5 min → fires.
      - eval_time: 16m
        alertname: TechnicianDataGap
        exp_alerts:
          - exp_labels:
              severity: none
              alert_class: freshness
            exp_annotations:
              summary: "Technician data gap — timing alerts suppressed during stabilization"
              description: "No check results were recorded for over 5 minutes within the last 10 minutes (process restart, connectivity loss, or host downtime). Rolling-average latency alerts are inhibited until the 15m averages re-stabilize."
      # Results have resumed (min 21) but the recent gap keeps it firing
      # across the stabilization window.
      - eval_time: 25m
        alertname: TechnicianDataGap
        exp_alerts:
          - exp_labels:
              severity: none
              alert_class: freshness
            exp_annotations:
              summary: "Technician data gap — timing alerts suppressed during stabilization"
              description: "No check results were recorded for over 5 minutes within the last 10 minutes (process restart, connectivity loss, or host downtime). Rolling-average latency alerts are inhibited until the 15m averages re-stabilize."
      # Window has slid past the gap — cleared, timing alerts un-inhibited.
      - eval_time: 30m
        alertname: TechnicianDataGap
        exp_alerts: []

  # seconds_since_last_run recording rule reflects the frozen timestamp.
  - name: seconds_since_last_run tracks the gap
    interval: 1m
    input_series:
      - series: 'technician_last_run_timestamp_seconds'
        values: '0+60x9 540+0x10 1260+60x9'
    promql_expr_test:
      - expr: technician:seconds_since_last_run
        eval_time: 5m
        exp_samples:
          - labels: 'technician:seconds_since_last_run'
            value: 0
      - expr: technician:seconds_since_last_run
        eval_time: 18m
        exp_samples:
          - labels: 'technician:seconds_since_last_run'
            value: 540

  # #324: browser checks run every 5–10 min, so the Web Vitals window is [1h].
  # A single bad render (one scrape held ~10 min) must not fire — it would under
  # a [15m] window that holds only 1–3 samples.
  - name: HighCLS ignores a single bad render at browser cadence
    interval: 1m
    input_series:
      # A 10-min scrape cadence modelled as a gauge held for 10 one-min samples.
      # One bad render of 0.30 at t=30–39, good (0.0) otherwise.
      - series: 'technician_browser_cls{name="homepage"}'
        values: '0+0x29 0.3+0x9 0+0x30'
    alert_rule_test:
      # Worst case: all ten bad samples in-window against the fewest good ones.
      # avg over [1h] ≈ 0.075 < 0.1, so no alert.
      - eval_time: 39m
        alertname: HighCLS
        exp_alerts: []

  - name: HighCLS fires on a sustained CLS regression
    interval: 1m
    input_series:
      - series: 'technician_browser_cls{name="homepage"}'
        values: '0.3+0x69'
    alert_rule_test:
      - eval_time: 30m
        alertname: HighCLS
        exp_alerts:
          - exp_labels:
              severity: warning
              name: homepage
            exp_annotations:
              summary: "High CLS for homepage"
              description: "CLS for homepage is 0.300 (1h avg, good ≤0.1)."

  # #333: an infra error freezes check_healthy, so CheckFailing can't fire. A
  # brief blip is a warning (CheckInfraError); a sustained blind spot escalates.
  - name: SustainedInfraError escalates a prolonged blind spot
    interval: 1m
    input_series:
      - series: 'technician_check_infra_error{type="domain_expiry",name="example.com",region="local"}'
        values: '1+0x20'
    alert_rule_test:
      # Under the 15m threshold: only the warning tier is active, not critical.
      - eval_time: 10m
        alertname: SustainedInfraError
        exp_alerts: []
      # Past 15m: escalates to a page.
      - eval_time: 16m
        alertname: SustainedInfraError
        exp_alerts:
          - exp_labels:
              severity: critical
              type: domain_expiry
              name: example.com
              region: local
            exp_annotations:
              summary: "example.com blind for 15m+ (infrastructure error)"
              description: "Check example.com (domain_expiry) has been unable to reach its data source or runtime for over 15 minutes, so the target's true state is unknown and check_healthy is frozen at its last value. Treat as a potential outage."

  - name: SustainedInfraError does not fire on a brief infra blip
    interval: 1m
    input_series:
      # Infra error for 8 min, then recovers — under the 15m threshold.
      - series: 'technician_check_infra_error{type="bgp",name="prefix",region="local"}'
        values: '1+0x7 0+0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: SustainedInfraError
        exp_alerts: []
