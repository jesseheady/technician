global:
  resolve_timeout: 5m

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'name']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: chatops
  routes:
    # ── Pager fan-out ───────────────────────────────────────────
    # Critical alerts go to the pager AND continue to the category
    # routes below, so on-call gets paged while the right channel
    # also gets the notification.
    - matchers:
        - severity = critical
      receiver: pager
      repeat_interval: 1h
      continue: true
      # Silence pager during deploys:
      # mute_time_intervals: ['maintenance']

    # ── Infrastructure ──────────────────────────────────────────
    # Probe failures, BGP hijacks, invalid certs, dropped domains,
    # Prometheus WAL corruption.
    - matchers:
        - alertname =~ "ProbeFailing|HighErrorRate|HighErrorRateWarn|TLSCertInvalid|BGPPrefixNotVisible|BGPOriginMismatch|DomainNotRegistered|PrometheusWALCorruptions|PrometheusStorageCritical"
      receiver: infrastructure
      repeat_interval: 1h

    # ── Expiry ──────────────────────────────────────────────────
    # TLS certificate and domain expiry warnings/criticals.
    # Grouped by alertname only (one notification per expiry type).
    - matchers:
        - alertname =~ "TLSCertExpiringSoon|TLSCertExpiryCritical|DomainExpiringSoon|DomainExpiryCritical"
      receiver: expiry
      group_by: ['alertname']
      repeat_interval: 12h

    # ── Performance ─────────────────────────────────────────────
    # Web vitals, HTTP timing, TCP, DNS, ICMP, UDP, NTP, resource
    # counts, and budget violations.
    - matchers:
        - alertname =~ "High(LCP|INP|CLS|TTFB|DNS|TLS|TCPConnect|TCPTLS|DNSQuery|ICMRTT|PacketLoss|NTPOffset|UDPRTT|ResourceCount)(Critical)?|BudgetViolation"
      receiver: performance
      repeat_interval: 4h

    # ── Catch-all ───────────────────────────────────────────────
    # Everything else (ProbeInfraError, PrometheusStorageHigh, and
    # any new rules not yet routed above).
    - receiver: chatops
      # Only notify during work hours:
      # active_time_intervals: ['business-hours']

# ── Time intervals ────────────────────────────────────────────────
# Named time windows for use in routes above. Reference them as:
#   mute_time_intervals: ['maintenance']     — silence during this window
#   active_time_intervals: ['business-hours'] — only notify during this window
#
# All times are UTC. Intervals have no effect until a route references them.
time_intervals:
  # Weekly maintenance / deploy window. Adjust day and times to suit.
  - name: maintenance
    time_intervals:
      - weekdays: ['tuesday']
        times:
          - start_time: '02:00'
            end_time: '04:00'

  # Weekends (Saturday and Sunday, all day).
  - name: weekends
    time_intervals:
      - weekdays: ['saturday', 'sunday']

  # Business hours (weekdays 09:00–18:00 UTC).
  - name: business-hours
    time_intervals:
      - weekdays: ['monday:friday']
        times:
          - start_time: '09:00'
            end_time: '18:00'

# ── Receivers ─────────────────────────────────────────────────────
# Discord for every receiver; Pushover on the pager for critical alerts.
# Secrets are injected via .env → sed at container start (see docker-compose).
receivers:
  - name: chatops
    discord_configs:
      - webhook_url: '__DISCORD_WEBHOOK_CHATOPS__'
        title: '{{ template "technician.discord.title" . }}'
        message: '{{ template "technician.discord.message" . }}'
        send_resolved: true

  - name: pager
    pushover_configs:
      - user_key: '__PUSHOVER_USER_KEY__'
        token: '__PUSHOVER_API_TOKEN__'
        title: '{{ template "technician.pushover.title" . }}'
        message: '{{ template "technician.pushover.message" . }}'
        priority: '{{ if eq .Status "firing" }}2{{ else }}0{{ end }}'
        retry: 30s
        expire: 1h
        send_resolved: true
    discord_configs:
      - webhook_url: '__DISCORD_WEBHOOK_INCIDENTS__'
        title: '{{ template "technician.discord.title" . }}'
        message: '{{ template "technician.discord.message" . }}'
        send_resolved: true

  - name: infrastructure
    discord_configs:
      - webhook_url: '__DISCORD_WEBHOOK_INFRA__'
        title: '{{ template "technician.discord.title" . }}'
        message: '{{ template "technician.discord.message" . }}'
        send_resolved: true

  - name: expiry
    discord_configs:
      - webhook_url: '__DISCORD_WEBHOOK_EXPIRY__'
        title: '{{ template "technician.discord.title" . }}'
        message: '{{ template "technician.discord.message" . }}'
        send_resolved: true

  - name: performance
    discord_configs:
      - webhook_url: '__DISCORD_WEBHOOK_PERF__'
        title: '{{ template "technician.discord.title" . }}'
        message: '{{ template "technician.discord.message" . }}'
        send_resolved: true

# ── Acknowledging / silencing alerts ─────────────────────────────
#
# repeat_interval (above) limits re-notification, but to fully silence
# an alert while investigating, use Alertmanager silences:
#
#   UI:  http://localhost:9093/#/silences  (create silence with matchers)
#   CLI: amtool silence add alertname=ProbeFailing name=myprobe --duration=2h
#   API: POST /api/v2/silences (for chatops bot integration)
#
# PagerDuty/OpsGenie ACKs stop escalation on their side but do NOT
# silence Alertmanager — it will re-send at the next repeat_interval.
# To silence both, create an Alertmanager silence as well.
#
# For chatops-driven silencing (e.g. react-to-silence in Slack/Discord),
# see karma (https://github.com/prymitive/karma) or build a bot that
# calls the Alertmanager silence API.

inhibit_rules:
  # ── Severity suppression ──────────────────────────────────────
  # Critical alerts suppress warning alerts for the same probe.
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ['name']

  # Aggregate error rate warning suppresses individual probe failure warnings.
  - source_matchers:
      - alertname = HighErrorRateWarn
    target_matchers:
      - alertname = ProbeFailing
    equal: ['name']

  # ── Invalid / gone suppression ────────────────────────────────
  # When a cert is invalid or a domain is unregistered, expiry alerts
  # are noise — including critical-tier expiry that the broad severity
  # rule above doesn't cover (both source and target are critical).

  # Invalid cert suppresses all expiry alerts.
  - source_matchers:
      - alertname = TLSCertInvalid
    target_matchers:
      - alertname =~ "TLSCertExpiringSoon|TLSCertExpiryCritical"
    equal: ['name']

  # Unregistered domain suppresses all expiry alerts.
  - source_matchers:
      - alertname = DomainNotRegistered
    target_matchers:
      - alertname =~ "DomainExpiringSoon|DomainExpiryCritical"
    equal: ['name']
