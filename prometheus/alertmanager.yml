global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'name']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    # Uncomment and configure one or more integrations:
    #
    # Slack:
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #     channel: '#alerts'
    #     title: '{{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
    #     send_resolved: true
    #
    # Discord (via alertmanager-discord bridge).
    # Discord's API rejects Alertmanager's native Slack attachment format,
    # so a bridge container is required. For simpler Discord notifications,
    # use native webhooks in technician.yml instead (no bridge needed).
    # See: https://github.com/benjojo/alertmanager-discord
    # webhook_configs:
    #   - url: 'http://alertmanager-discord:9094'
    #     send_resolved: true
    #
    # PagerDuty:
    # pagerduty_configs:
    #   - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY'
    #     severity: '{{ if eq .GroupLabels.severity "critical" }}critical{{ else }}warning{{ end }}'
    #
    # Telegram:
    # telegram_configs:
    #   - bot_token: 'YOUR_BOT_TOKEN'
    #     chat_id: 123456789
    #     message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
    #     send_resolved: true
    #
    # Pushover:
    # pushover_configs:
    #   - user_key: 'YOUR_PUSHOVER_USER_KEY'
    #     token: 'YOUR_PUSHOVER_APP_TOKEN'
    #     priority: '{{ if eq .GroupLabels.severity "critical" }}1{{ else }}0{{ end }}'
    #     send_resolved: true
    #
    # OpsGenie:
    # opsgenie_configs:
    #   - api_key: 'YOUR_OPSGENIE_API_KEY'
    #     priority: '{{ if eq .GroupLabels.severity "critical" }}P1{{ else }}P3{{ end }}'
    #     send_resolved: true
    #
    # Email:
    # email_configs:
    #   - to: 'alerts@example.com'
    #     from: 'technician@example.com'
    #     smarthost: 'smtp.example.com:587'
    #     auth_username: 'user'
    #     auth_password: 'pass'
    #     send_resolved: true
    #
    # Generic webhook (any HTTP endpoint):
    # webhook_configs:
    #   - url: 'http://your-webhook-endpoint/alerts'
    #     send_resolved: true

inhibit_rules:
  # If a probe is failing (critical), suppress the budget violation warnings for it.
  - source_match:
      alertname: ProbeFailing
    target_match:
      severity: warning
    equal: ['name']
