groups:
  - name: technician_recording
    rules:
      - record: technician:failure_ratio
        expr: |
          count by (name, type) (technician_probe_up == 0)
          / count by (name, type) (technician_probe_up)

      - record: technician:daily_availability
        expr: |
          avg_over_time((
            sum by (name, type) (technician_probe_up)
            / count by (name, type) (technician_probe_up)
            > bool 0.5
          )[1d:])

      - record: technician:browser_lcp_p95
        expr: quantile(0.95, technician_browser_lcp_ms) by (name)

  - name: technician_alerts
    rules:
      - alert: ProbeFailing
        expr: technician_probe_up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} failing from {{ $labels.region }}"
          description: "Probe {{ $labels.name }} ({{ $labels.type }}) has been failing from {{ $labels.region }} for 3 minutes."

      - alert: HighLCP
        expr: technician_browser_lcp_ms > 2500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High LCP for {{ $labels.name }}"
          description: "LCP for {{ $labels.name }} is {{ $value }}ms (good ≤2500ms)."

      - alert: HighINP
        expr: technician_browser_inp_ms > 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High INP for {{ $labels.name }}"
          description: "INP (Interaction to Next Paint) for {{ $labels.name }} is {{ $value }}ms (good ≤200ms)."

      - alert: BudgetViolation
        expr: technician_budget_violation == 1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Budget violation for {{ $labels.name }}"
          description: "Metric {{ $labels.metric }} for probe {{ $labels.name }} exceeds budget."

      - alert: HighTTFB
        expr: technician_http_ttfb_seconds > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High TTFB for {{ $labels.name }}"
          description: "TTFB for {{ $labels.name }} is {{ $value }}s."

      - alert: HighDNS
        expr: technician_http_dns_seconds > 0.25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High DNS latency for {{ $labels.name }}"
          description: "DNS lookup for {{ $labels.name }} is {{ $value }}s (threshold 250ms)."

      - alert: HighTLS
        expr: technician_http_tls_seconds > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High TLS latency for {{ $labels.name }}"
          description: "TLS handshake for {{ $labels.name }} is {{ $value }}s (threshold 500ms)."

      - alert: HighCLS
        expr: technician_browser_cls > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CLS for {{ $labels.name }}"
          description: "Cumulative Layout Shift for {{ $labels.name }} is {{ $value }} (good ≤0.1)."

      - alert: HighResourceCount
        expr: technician_browser_resource_count > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High resource count for {{ $labels.name }}"
          description: "{{ $labels.name }} loaded {{ $value }} resources (threshold 100)."

      - alert: TLSCertExpiringSoon
        expr: technician_tls_cert_expiry_days < 30 and technician_tls_cert_expiry_days > 7
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "TLS cert expiring soon for {{ $labels.name }}"
          description: "Certificate for {{ $labels.name }} expires in {{ $value }} days."

      - alert: TLSCertExpiryCritical
        expr: technician_tls_cert_expiry_days <= 7
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "TLS cert expiry critical for {{ $labels.name }}"
          description: "Certificate for {{ $labels.name }} expires in {{ $value }} days."

      - alert: TLSCertInvalid
        expr: technician_tls_cert_valid == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "TLS certificate invalid for {{ $labels.name }}"
          description: "Certificate chain validation failed for {{ $labels.name }}."

      - alert: BGPPrefixNotVisible
        expr: technician_bgp_prefix_visible == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "BGP prefix not visible for {{ $labels.name }}"
          description: "Prefix monitored by {{ $labels.name }} is not visible in the global routing table."

      - alert: BGPOriginMismatch
        expr: technician_bgp_origin_match == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "BGP origin AS mismatch for {{ $labels.name }}"
          description: "Origin ASN for {{ $labels.name }} does not match expected value (possible hijack)."

      - alert: DomainExpiringSoon
        expr: technician_domain_expiry_days < 30 and technician_domain_expiry_days > 7
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Domain expiring soon for {{ $labels.name }}"
          description: "Domain {{ $labels.name }} expires in {{ $value }} days."

      - alert: DomainExpiryCritical
        expr: technician_domain_expiry_days <= 7
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Domain expiry critical for {{ $labels.name }}"
          description: "Domain {{ $labels.name }} expires in {{ $value }} days."

      - alert: DomainNotRegistered
        expr: technician_domain_registered == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Domain not registered for {{ $labels.name }}"
          description: "Domain {{ $labels.name }} is not found in RDAP (may have expired or been dropped)."

      - alert: ProbeInfraError
        expr: technician_probe_infra_error == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} has infrastructure errors"
          description: "Probe {{ $labels.name }} ({{ $labels.type }}) has been failing due to infrastructure errors from {{ $labels.region }} for 5 minutes. The probe is not testing its target — check logs for details (missing dependencies, network access, permissions)."

      - alert: HighErrorRate
        expr: |
          sum by (name) (technician_probe_up == 0)
          / count by (name) (technician_probe_up) > 0.5
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "High error rate for {{ $labels.name }}"
          description: "More than 50% of probes for {{ $labels.name }} are failing."

      # ── Test alert ──────────────────────────────────────────────
      # Uncomment to validate the full alert pipeline:
      #   Prometheus rule → Alertmanager → receiver (Discord, Slack, etc.)
