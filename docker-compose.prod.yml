# Production overlay: pull the published image instead of building from source.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Pin TECHNICIAN_VERSION to a released tag for reproducible deploys; it defaults
# to :latest. The image is published to GHCR by the release workflow.
#
# `!reset null` drops the base file's `build:` so Compose pulls rather than builds.
services:
  technician:
    build: !reset null
    image: ghcr.io/jesseheady/technician:${TECHNICIAN_VERSION:-latest}
