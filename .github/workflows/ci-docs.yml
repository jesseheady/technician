# Companion to ci.yml. ci.yml skips docs/config-only changes via paths-ignore,
# which would otherwise leave the required "CI Passed" check unreported and block
# such PRs from merging. This reports a passing "CI Passed" for exactly those paths.
# The path lists here must stay the mirror image of ci.yml's paths-ignore.
name: CI (docs/config)

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'dashboards/**'
      - 'scripts/**'
      - '**.md'
      - 'LICENSE'
      - 'renovate.json'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'dashboards/**'
      - 'scripts/**'
      - '**.md'
      - 'LICENSE'
      - 'renovate.json'

permissions:
  contents: read

jobs:
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    steps:
      - name: No build required
        run: echo "Only docs/config paths changed; build/test not required."
