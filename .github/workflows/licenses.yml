name: licenses

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  licenses:
    name: Dependency license types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@v1.6.0

      # Fail if any dependency carries a copyleft / non-permissive license
      # (restricted = GPL/AGPL/LGPL, reciprocal = MPL/EPL, forbidden = e.g. WTFPL).
      # The attribution bundle itself is generated at build/release time, so there
      # is nothing here to drift — this gate just keeps the dep tree permissive.
      - name: Check dependency license types
        run: |
          go-licenses check ./... \
            --disallowed_types=forbidden,restricted,reciprocal \
            --ignore github.com/jesseheady/technician
