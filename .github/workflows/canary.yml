name: Canary Synthetic Check

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to check"
        required: true
        type: string

jobs:
  synthetic-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    container:
      image: ghcr.io/${{ github.repository }}/technician:latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run canary checks
        run: technician validate --config examples/canary/technician.yml --budget examples/budgets.yml --output gha
        env:
          CANARY_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.target_url || github.event.deployment_status.environment_url }}

      - name: Upload HAR artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: check-results
          path: /tmp/technician/artifacts/
          retention-days: 7
