name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      playwright: ${{ steps.filter.outputs.playwright }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Fail safe: if the diff base is unknown, run the full suite.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "playwright=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null); then
            echo "Could not diff $BASE_SHA..$HEAD_SHA; running the full suite to be safe."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "playwright=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # code: any change outside docs/config -> build / test / lint / validate
          if echo "$changed" | grep -qvE '^(docs|dashboards|scripts)/|\.md$|^LICENSE$|^renovate\.json$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # playwright: prober or example configs -> browser validation
          if echo "$changed" | grep -qE '^(internal/playwright/|examples/)'; then
            echo "playwright=true" >> "$GITHUB_OUTPUT"
          else
            echo "playwright=false" >> "$GITHUB_OUTPUT"
          fi
          # docker: image inputs -> build the container image on PRs too, so a
          # broken Dockerfile fails before merge instead of only on main push.
          if echo "$changed" | grep -qE '^(Dockerfile|\.dockerignore|internal/playwright/scripts/)'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o technician .

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: technician-binary
          path: technician
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      # Coverage floor: fail if total drops below the ratchet. Raise MIN in the
      # same PR that adds tests; never lower it to make a red build pass.
      # ponytail: go's own tooling + one awk, no Codecov account or token.
      - name: Coverage gate
        run: |
          MIN=63.5
          total=$(go tool cover -func=coverage.out | awk '/^total:/{print substr($3, 1, length($3)-1)}')
          echo "total coverage: ${total}% (floor: ${MIN}%)"
          awk -v t="$total" -v m="$MIN" 'BEGIN { if (t+0 < m+0) { printf "coverage %.1f%% is below floor %.1f%%\n", t, m; exit 1 } }'

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./...

  validate:
    name: Validate checks + budgets
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: technician-binary

      - name: Make binary executable
        run: chmod +x technician

      - name: Validate (non-browser checks)
        run: ./technician validate --config examples/technician.yml --budget examples/budgets.yml --output gha --exclude-type playwright --fail-on-error --fail-on-budget=false

  validate-playwright:
    name: Validate Playwright checks
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.playwright == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install Playwright + Chromium
        run: |
          cd internal/playwright/scripts
          npm ci
          npx playwright install chromium

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: technician-binary

      - name: Make binary executable
        run: chmod +x technician

      - name: Validate Playwright checks
        run: ./technician validate --config examples/technician.yml --budget examples/budgets.yml --output gha --check-type playwright --fail-on-error --fail-on-budget=false
        env:
          NODE_PATH: internal/playwright/scripts/node_modules

      - name: Upload HAR artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-artifacts
          path: /tmp/technician/artifacts/
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: changes
    # On main pushes when code changed, and on any PR that touches image inputs
    # so a broken Dockerfile is caught before merge (feeds the CI Passed gate).
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true')
      || needs.changes.outputs.docker == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: false
          tags: technician:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, build, test, lint, validate, validate-playwright, docker]
    steps:
      - name: Check results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$FAILED" == "true" ]]; then
            echo "A required job failed or was cancelled"
            exit 1
          fi
