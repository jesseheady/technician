name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'dashboards/**'
      - 'examples/**'
      - 'scripts/**'
      - '**.md'
      - 'LICENSE'
      - 'renovate.json'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'dashboards/**'
      - 'examples/**'
      - 'scripts/**'
      - '**.md'
      - 'LICENSE'
      - 'renovate.json'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o technician .

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: technician-binary
          path: technician
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

  validate:
    name: Validate checks + budgets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: technician-binary

      - name: Make binary executable
        run: chmod +x technician

      - name: Validate (non-browser checks)
        run: ./technician validate --config examples/technician.yml --budget examples/budgets.yml --output gha

  validate-playwright:
    name: Validate Playwright checks
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Playwright + Chromium
        run: |
          cd internal/playwright/scripts
          npm ci
          npx playwright install chromium

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: technician-binary

      - name: Make binary executable
        run: chmod +x technician

      - name: Validate Playwright checks
        run: ./technician validate --config examples/technician.yml --budget examples/budgets.yml --output gha
        env:
          NODE_PATH: internal/playwright/scripts/node_modules

      - name: Upload HAR artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: /tmp/technician/artifacts/
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: technician:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    if: always()
    needs: [build, test, lint, validate, validate-playwright]
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
