name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'dashboards/**'
      - 'scripts/**'
      - '**.md'
      - 'LICENSE'
      - 'renovate.json'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'dashboards/**'
      - 'scripts/**'
      - '**.md'
      - 'LICENSE'
      - 'renovate.json'

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      playwright: ${{ steps.filter.outputs.playwright }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Detect Playwright-relevant changes
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Fail safe: if the diff base is unknown, run Playwright to preserve coverage.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "playwright=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null); then
            echo "Could not diff $BASE_SHA..$HEAD_SHA; running Playwright to be safe."
            echo "playwright=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$changed" | grep -qE '^(internal/playwright/|examples/)'; then
            echo "playwright=true" >> "$GITHUB_OUTPUT"
          else
            echo "playwright=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Build binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o technician .

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: technician-binary
          path: technician
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./...

  validate:
    name: Validate checks + budgets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: technician-binary

      - name: Make binary executable
        run: chmod +x technician

      - name: Validate (non-browser checks)
        run: ./technician validate --config examples/technician.yml --budget examples/budgets.yml --output gha --exclude-type playwright --fail-on-error --fail-on-budget=false

  validate-playwright:
    name: Validate Playwright checks
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.playwright == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Install Playwright + Chromium
        run: |
          cd internal/playwright/scripts
          npm ci
          npx playwright install chromium

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: technician-binary

      - name: Make binary executable
        run: chmod +x technician

      - name: Validate Playwright checks
        run: ./technician validate --config examples/technician.yml --budget examples/budgets.yml --output gha --check-type playwright --fail-on-error --fail-on-budget=false
        env:
          NODE_PATH: internal/playwright/scripts/node_modules

      - name: Upload HAR artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-artifacts
          path: /tmp/technician/artifacts/
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          push: false
          tags: technician:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, build, test, lint, validate, validate-playwright]
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
