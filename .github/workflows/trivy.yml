name: Trivy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1' # Monday 08:00 UTC

permissions:
  contents: read

jobs:
  filesystem:
    name: Scan Go dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      # Secrets are scanned at every severity: trivy rates some real credentials
      # below HIGH (a JWT is MEDIUM), and a severity filter drops them silently.
      - name: Run Trivy secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '1'

      - name: Run Trivy misconfig scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

  container:
    name: Scan container image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: false
          load: true
          tags: technician:scan
          cache-from: type=gha

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: technician:scan
          format: table
          severity: CRITICAL,HIGH
          # Gate on fixable CVEs only. Unfixed upstream Debian/Node base CVEs
          # (no patch available) are ignored so they can't block CI; a fixable
          # CRITICAL/HIGH fails the build so a base-image bump (Renovate keeps
          # the digest current) is required to clear it.
          ignore-unfixed: true
          exit-code: '1'
          # Fixable CVEs we can't clear yet (fix not in the base image) are
          # deferred here with an expiry + reason. Expired entries lapse and
          # fail CI again; the trivy-ignore-audit workflow reconciles them.
          trivyignores: .trivyignore.yaml