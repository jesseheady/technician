name: Trivy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1' # Monday 08:00 UTC

permissions:
  contents: read

jobs:
  filesystem:
    name: Scan Go dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      # Secrets are scanned at every severity: trivy rates some real credentials
      # below HIGH (a JWT is MEDIUM), and a severity filter drops them silently.
      - name: Run Trivy secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '1'

      - name: Run Trivy misconfig scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          # Accepted architectural findings in IaC we publish, scoped by `paths`
          # to the file that justifies each one. Trivy only auto-detects the
          # legacy plain-text .trivyignore, so this must be explicit.
          trivyignores: .trivyignore.yaml

  container-changes:
    name: Detect container changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      container: ${{ steps.filter.outputs.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect container-affecting changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Fail safe: if the diff base is unknown, scan.
          if [ -z "$BASE_SHA" ] || ! changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null); then
            echo "container=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$changed" | grep -qE '^(Dockerfile|\.dockerignore|\.trivyignore\.yaml|internal/playwright/scripts/|scripts/gen-licenses\.sh)'; then
            echo "container=true" >> "$GITHUB_OUTPUT"
          else
            echo "container=false" >> "$GITHUB_OUTPUT"
          fi

  container:
    name: Scan container image
    runs-on: ubuntu-latest
    needs: [container-changes]
    # Always on push to main and on the weekly schedule (base-image CVEs appear
    # over time, with no commit to trigger them). On PRs, only when the image's
    # own inputs change — the build is expensive and most PRs cannot affect it.
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       needs.container-changes.outputs.container == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: false
          load: true
          tags: technician:scan
          cache-from: type=gha
          # The runtime stage installs Debian packages, so a cache hit pins them
          # to whenever the layer was first built and the scan reports CVEs that
          # a fresh `apt` would already have fixed. Nothing else invalidates it:
          # the base digest and instructions rarely change. The builder stage
          # stays cached.
          no-cache-filters: runtime

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: technician:scan
          format: table
          severity: CRITICAL,HIGH
          # Gate on fixable CVEs only. Unfixed upstream Debian/Node base CVEs
          # (no patch available) are ignored so they can't block CI; a fixable
          # CRITICAL/HIGH fails the build so a base-image bump (Renovate keeps
          # the digest current) is required to clear it.
          ignore-unfixed: true
          exit-code: '1'
          # Fixable CVEs we can't clear yet (fix not in the base image) are
          # deferred here with an expiry + reason. Expired entries lapse and
          # fail CI again; the trivy-ignore-audit workflow reconciles them.
          trivyignores: .trivyignore.yaml
  scan-passed:
    name: Container scan passed
    runs-on: ubuntu-latest
    # Always runs, so the required status check always reports. The container
    # job is skipped on most PRs by design, and a required context that never
    # reports leaves a PR unmergeable.
    if: always()
    needs: [filesystem, container-changes, container]
    steps:
      - name: Check results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$FAILED" == "true" ]]; then
            echo "A required job failed or was cancelled"
            exit 1
          fi
